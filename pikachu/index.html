<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio - Tarjeta Pikachu</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="tarjeta-pikachu">

        <div class="info-pikachu">
