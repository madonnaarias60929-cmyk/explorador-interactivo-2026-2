<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Formularios - Semana 2</title>
    <style>
        /* Unos pequeños estilos básicos para que se vea ordenado */
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        form {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        p, fieldset {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004999;
        }
    </style>
</head>
<body>

    <h1>Registro de Estudiante</h1>

    <form action="/enviar" method="post">

        <!-- Nombre completo -->
        <p>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre"
                   required minlength="3" maxlength="60"
                   placeholder="Ej: Ana García">
        </p>

        <!-- Correo institucional -->
        <p>
            <label for="correo">Correo institucional</label>
            <input type="email" id="correo" name="correo" required
                   pattern=".+@ucaldas\.edu\.co"
                   title="Debe ser un correo @ucaldas.edu.co">
        </p>

        <!-- Edad -->
        <p>
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" min="15" max="99">
        </p>

        <!-- Fecha de nacimiento -->
        <p>
            <label for="nacimiento">Fecha de nacimiento</label>
            <input type="date" id="nacimiento" name="nacimiento">
        </p>

        <!-- Lista desplegable de semestre -->
        <p>
            <label for="semestre">Semestre</label>
            <select id="semestre" name="semestre" required>
                <option value="">-- Selecciona --</option>
                <option value="1">Primero</option>
                <option value="2">Segundo</option>
                <option value="3">Tercero o superior</option>
            </select>
        </p>

        <!-- Jornada preferida (Radios) -->
        <fieldset>
            <legend>¿Jornada preferida?</legend>
            <label><input type="radio" name="jornada" value="dia" checked> Diurna</label>
            <label><input type="radio" name="jornada" value="noche"> Nocturna</label>
        </fieldset>

        <!-- Mensaje -->
        <p>
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" required
                      minlength="10" placeholder="Escribe al menos 10 caracteres"></textarea>
        </p>

        <!-- Tratamiento de datos (Checkbox) -->
        <p>
            <label>
                <input type="checkbox" name="acepta" required>
                Acepto el tratamiento de mis datos
            </label>
        </p>

        <!-- Botón de envío -->
        <button type="submit">Enviar</button>
    </form>

</body>
</html>
