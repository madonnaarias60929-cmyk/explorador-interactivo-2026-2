<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avance 6 - Formulario de Perfil</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="avance-main">
        <section class="tarjeta-contacto-avance">
            <h2>Ingeniería de Sistemas e Informática</h2>
            <p class="sub-avance">Universidad de Caldas - Formulario de registro de proyectos</p>
            <form class="form-avance">
                <input type="text" placeholder="Nombre del proyecto" required>
                <select required>
                    <option value="" disabled selected>Seleccione el lenguaje/tecnología</option>
                    <option value="html-css">HTML5 & CSS3</option>
                    <option value="java">Java / POO</option>
                    <option value="sql">MySQL / Bases de Datos</option>
                </select>
                <textarea rows="3" placeholder="Descripción breve del avance..."></textarea>
                <button type="submit">Registrar Avance</button>
            </form>
        </section>
    </main>
</body>
</html>
