<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explora un catálogo de recetas de cocina del mundo con fotografías, ingredientes y preparación.">
  <title>Explorador Recetas | Cocina del mundo</title>
  <link rel="stylesheet" href="./css/output.css">
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

  <!-- Barra de navegación -->
  <header class="sticky top-0 z-20 border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-5 py-5">
      <a href="#" class="text-2xl font-extrabold tracking-tight">
        Explorador <span class="text-indigo-600">Recetas</span>
      </a>

      <div class="flex items-center gap-5 text-sm font-semibold sm:gap-8 sm:text-base">
        <a href="#recetas" class="text-indigo-600">Recetas</a>
        <a href="#buscador" class="transition hover:text-indigo-600">Categorías</a>
        <button id="btn-favoritos"
          type="button"
          aria-pressed="false"
          aria-label="Mostrar solo mis recetas favoritas"
          class="transition hover:text-indigo-600 aria-pressed:text-indigo-600">
          ♡ Favoritos <span id="contador-favoritos">0</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-7xl px-5 py-8 sm:py-10">

    <!-- Título y buscador -->
    <section id="buscador" class="mx-auto mb-7 max-w-4xl">
      <p class="mb-2 text-sm font-bold uppercase tracking-widest text-indigo-600">
        INSPÍRATE Y COCINA
      </p>

      <h1 class="mb-6 text-4xl font-extrabold tracking-tight sm:text-5xl">
        Explora recetas
      </h1>

      <form id="form-busqueda"
        class="grid grid-cols-1 gap-3 sm:grid-cols-[minmax(0,1fr)_220px_auto]">

        <input
          id="buscar-receta"
          type="search"
          placeholder="Buscar por nombre o país..."
          aria-label="Buscar recetas por nombre o país"
          class="min-w-0 rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
        >

        <!-- Las categorías reales las agrega app.js al cargar el catálogo -->
        <select
          id="filtro-categoria"
          aria-label="Filtrar por categoría"
          class="rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500"
        >
          <option value="Todas">Todas las categorías</option>
        </select>

        <button type="submit"
          class="rounded-xl bg-indigo-600 px-7 py-3 font-bold text-white shadow-sm transition hover:bg-indigo-700">
          Buscar
        </button>
      </form>
    </section>

    <!-- Resumen de resultados -->
    <section id="recetas">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <p id="total-recetas" class="text-sm text-slate-500 sm:text-base"
          aria-live="polite">
          Cargando recetas...
        </p>

        <button id="limpiar-filtros"
          type="button"
          class="text-sm font-semibold text-indigo-600 hover:underline">
          Limpiar filtros
        </button>
      </div>

      <!-- JavaScript crea las tarjetas aquí -->
      <div id="lista-recetas"
        class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      </div>

      <div id="sin-resultados" class="hidden py-16 text-center">
        <p class="mb-2 text-2xl font-bold">No encontramos recetas</p>
        <p class="text-slate-500">Prueba otro nombre o cambia la categoría.</p>
      </div>
    </section>
  </main>

  <footer class="mt-12 border-t border-slate-200 bg-white px-5 py-7 text-center">
    <p class="font-bold">Explorador <span class="text-indigo-600">Recetas</span></p>
    <p class="mt-1 text-sm text-slate-500">
      Descubre nuevos sabores y disfruta cocinando.
    </p>
  </footer>

  <!-- Ventana de detalle de receta -->
  <dialog id="modal-receta"
    class="m-auto max-h-[90vh] w-[calc(100%-2rem)] max-w-2xl overflow-y-auto rounded-2xl bg-white p-0 shadow-2xl backdrop:bg-slate-950/60">

    <div id="contenido-modal"></div>

    <form method="dialog" class="border-t border-slate-100 p-4">
      <button
        class="w-full rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white transition hover:bg-indigo-700">
        Cerrar receta
      </button>
    </form>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
