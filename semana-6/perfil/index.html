<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto Perfil - Semana 6</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h2>Contacto - Madonna Arias</h2>
        <form>
            <div class="grupo-input">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="grupo-input">
                <label for="email">Correo:</label>
                <input type="email" id="email" name="email" placeholder="estudiante@ucaldas.edu.co" required>
            </div>
            <div class="grupo-input">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje..."></textarea>
            </div>
            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
        </form>
    </div>
</body>
</html>
