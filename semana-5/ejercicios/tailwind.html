<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Tailwind</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    /* ===== Versión A · CSS propio ===== */
    .lista   { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .tarjeta { display: flex; flex-direction: column; background: white;
               border-radius: 0.75rem; padding: 1rem;
               box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
    .tarjeta h3 { font-size: 1.125rem; font-weight: 700; margin: 0.5rem 0 0; }
    .tarjeta .precio { color: #4f46e5; font-weight: 600; margin: 0; }
    .tarjeta button { margin-top: auto; background: #4f46e5; color: white;
                      border: 0; border-radius: 0.5rem; padding: 0.5rem; cursor: pointer; }
    .tarjeta button:hover { background: #4338ca; }
  </style>
</head>
<body class="bg-slate-100 p-8">

  <h2 class="text-2xl font-bold mb-4">A · CSS propio</h2>
  <div class="lista">
    <article class="tarjeta">
      <h3>Producto 1</h3>
      <p class="precio">$99.900</p>
      <button>Agregar</button>
    </article>
    <article class="tarjeta">
      <h3>Producto 2</h3>
      <p class="precio">$45.000</p>
      <button>Agregar</button>
    </article>
    <article class="tarjeta">
      <h3>Producto 3</h3>
      <p class="precio">$32.500</p>
      <button>Agregar</button>
    </article>
  </div>

  <h2 class="text-2xl font-bold mt-10 mb-4">B · Tailwind</h2>
  <div class="grid grid-cols-3 gap-6">
    <article class="bg-white rounded-xl shadow-md p-4 flex flex-col">
      <h3 class="text-lg font-bold mt-2">Producto 1</h3>
      <p class="text-indigo-600 font-semibold">$99.900</p>
      <button class="mt-auto bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Agregar</button>
    </article>
    <article class="bg-white rounded-xl shadow-md p-4 flex flex-col">
      <h3 class="text-lg font-bold mt-2">Producto 2</h3>
      <p class="text-indigo-600 font-semibold">$45.000</p>
      <button class="mt-auto bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Agregar</button>
    </article>
    <article class="bg-white rounded-xl shadow-md p-4 flex flex-col">
      <h3 class="text-lg font-bold mt-2">Producto 3</h3>
      <p class="text-indigo-600 font-semibold">$32.500</p>
      <button class="mt-auto bg-indigo-600 text-white rounded-lg py-2 hover:bg-indigo-700">Agregar</button>
    </article>
  </div>
</body>
</html>
